spring:
  application:
    name: etf-trading-bot
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/trading}
    username: ${DB_USER:trading}
    password: ${DB_PASSWORD:trading}
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  server:
    address: 127.0.0.1
  metrics:
    tags:
      application: etf-trading-bot
  tracing:
    # Off unless TRACING_ENABLED=true (the compose stack turns it on and points it at the OTel collector).
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: 1.0   # a handful of jobs per day: keep every trace
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

trading:
  # Risk limits live in configuration, not code. Changing the starting values requires an ADR (ADR-0016).
  risk:
    max-weight-per-asset: 0.25
    max-daily-loss: 0.02
    agent-max-drawdown: 0.15
  etoro:
    # Secrets only through environment variables; nothing sensitive in the repository (ADR-0010).
    base-url: https://public-api.etoro.com
    api-key: ${ETORO_API_KEY:}
    user-key: ${ETORO_USER_KEY:}
    max-reads-per-minute: 60
    max-writes-per-minute: 20
    # DEMO only: real orders are refused at start (ADR-0028). Hard cap per order, in the account currency.
    mode: DEMO
    max-order-amount: 10
    # Smallest order eToro accepts (10 USD); the risk manager drops smaller ones instead of sending them.
    min-order-amount: 10
    # ISIN=eToro instrument id, comma separated. Ids seen in the eToro catalogue; the ISINs are UNVERIFIED (phase 0).
    instruments: ${TRADING_ETORO_INSTRUMENTS:}
  live:
    # Daily cycle on the eToro DEMO account (ADR-0028). Off until switched on with TRADING_LIVE_ENABLED=true.
    enabled: false
    agent-id: live-demo
    strategy: buy-and-hold
    isin: ${TRADING_LIVE_ISIN:}
    capital: 40
    cron: "0 15 19 * * MON-FRI"
  api:
    # JSON API that creates, changes, stops and resumes agents (ADR-0030). Disabled unless a token of 16+ characters is set.
    token: ${TRADING_API_TOKEN:}
    port: 8100
    bind-address: ${TRADING_API_BIND_ADDRESS:127.0.0.1}
    allowed-origin: ${TRADING_API_ALLOWED_ORIGIN:http://localhost:5173}
  prod:
    # Switch to PROD (ADR-0031). OFF by default. With it on, the secret is required (scripts/new-mfa-secret.sh).
    # Even in PROD no real broker exists yet: the daily cycle does not trade while the mode is PROD.
    enabled: ${TRADING_PROD_ENABLED:false}
    mfa-secret: ${TRADING_PROD_MFA_SECRET:}
  killswitch:
    # Endpoint disabled unless a token of 16+ characters is set. Loopback only.
    token: ${KILL_SWITCH_TOKEN:}
    port: 8099
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
  arena:
    # Nightly arena run; off until a universe and benchmark are configured.
    enabled: false
    capital: 100
    report-dir: reports/arena
    # First day the agents trade (yyyy-MM-dd). Earlier data is only history; without it the replay would retire agents for past crashes.
    start-date: ${ARENA_START_DATE:}
  monitoring:
    # Read-only status page (loopback only): /status and /metrics. Negative port disables it.
    port: 8098
    # Loopback by default. The container sets 0.0.0.0 and never publishes the port, so only the private compose network sees it.
    bind-address: ${MONITORING_BIND_ADDRESS:127.0.0.1}
    # File the backup job touches after each verified dump; its age becomes trading_backup_age_seconds. Empty: not exported.
    backup-marker: ${BACKUP_MARKER:}
    watchdog-enabled: true
