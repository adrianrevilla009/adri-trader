# The whole system on one machine: `make up`. Nothing is published to the network except Grafana on 127.0.0.1:3000
# (reach it with an SSH tunnel on a server). Everything else talks over the private compose network.
#
# Profiles:   (none)          database, bot, backups
#             observability   + Prometheus, Alertmanager, Grafana, Tempo, OpenTelemetry collector   (make up does both)
#
# Secrets come from .env (git-ignored; `make init` generates it). Images are pinned by digest.

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "5"}   # logs cannot fill the disk

services:
  postgres:
    <<: *hardening
    image: postgres:16-alpine@sha256:1d5b02d3a9941fbd52437db4107f8c52d6297dac553ca1e5c299ebb3756b4857
    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: ${DB_USER:-trading}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set, run make init}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # the postgres image needs these to start and drop privileges to its own user
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-trading} -d trading"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    networks: [backend]

  app:
    <<: *hardening
    build: .
    # on a server: APP_IMAGE=ghcr.io/<owner>/adri-trader@sha256:<digest> docker compose up -d --no-build
    image: ${APP_IMAGE:-etf-trading-bot:local}
    depends_on:
      postgres: {condition: service_healthy}
    env_file:
      - config/dev-universe.env          # UNVERIFIED development universe (see the file)
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://postgres:5432/trading
      DB_USER: ${DB_USER:-trading}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set, run make init}
      ETORO_API_KEY: ${ETORO_API_KEY:-}
      ETORO_USER_KEY: ${ETORO_USER_KEY:-}
      KILL_SWITCH_TOKEN: ${KILL_SWITCH_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # Market data: Yahoo (read-only GET requests). The first start downloads the history; later starts only add new days.
      TRADING_INGESTION_ENABLED: ${TRADING_INGESTION_ENABLED:-true}
      TRADING_INGESTION_SOURCE: yahoo
      TRADING_INGESTION_FROM_YEAR: "2009"
      TRADING_INGESTION_RUN_ON_STARTUP: ${TRADING_INGESTION_RUN_ON_STARTUP:-true}
      TRADING_ARENA_ENABLED: "true"
      ARENA_START_DATE: ${ARENA_START_DATE:-}
      # Reachable only on the private network (the port is not published). Loopback inside the container still works
      # for the image healthcheck.
      MONITORING_BIND_ADDRESS: 0.0.0.0
      BACKUP_MARKER: /backups/last_success
      TRACING_ENABLED: ${TRACING_ENABLED:-true}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - reports:/app/reports
      - backups:/backups:ro
    mem_limit: 768m
    networks: [backend]

  # Dump every night at 03:15 (UTC), verify it is readable, keep the last 14. Restore drill: scripts/restore-check.sh
  backup:
    <<: *hardening
    image: postgres:16-alpine@sha256:1d5b02d3a9941fbd52437db4107f8c52d6297dac553ca1e5c299ebb3756b4857
    depends_on:
      postgres: {condition: service_healthy}
    entrypoint: ["/bin/sh", "/ops/backup/backup-loop.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${DB_USER:-trading}
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set, run make init}
      PGDATABASE: trading
      BACKUP_HOUR_UTC: "03"
      BACKUP_MINUTE: "15"
      BACKUP_KEEP: "14"
    volumes:
      - ./ops/backup:/ops/backup:ro
      - backups:/backups
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 128m
    networks: [backend]

  # ---------------------------------------------------------------- observability
  prometheus:
    <<: *hardening
    profiles: [observability]
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    depends_on: [alertmanager]
    mem_limit: 512m
    networks: [backend]

  alertmanager:
    <<: *hardening
    profiles: [observability]
    image: prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    # Renders the config from the environment (Telegram), then starts. See ops/alertmanager/entrypoint.sh.
    entrypoint: ["/bin/sh", "/ops/alertmanager/entrypoint.sh"]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      HEARTBEAT_URL: ${HEARTBEAT_URL:-}
    volumes:
      - ./ops/alertmanager:/ops/alertmanager:ro
      - amdata:/alertmanager
    mem_limit: 128m
    networks: [backend]

  otel-collector:
    <<: *hardening
    profiles: [observability]
    image: otel/opentelemetry-collector:0.130.0@sha256:0c066d4388070dad8dc9961d9f23649e85a226620e6b359334e4a6c7f9d73b23
    command: ["--config=/etc/otel/collector.yml"]
    volumes:
      - ./ops/otel/collector.yml:/etc/otel/collector.yml:ro
    depends_on: [tempo]
    mem_limit: 256m
    networks: [backend]

  tempo:
    <<: *hardening
    profiles: [observability]
    image: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    command: ["-config.file=/etc/tempo/tempo.yml"]
    user: "10001:10001"
    volumes:
      - ./ops/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempodata:/var/tempo
    mem_limit: 512m
    networks: [backend]

  grafana:
    <<: *hardening
    profiles: [observability]
    image: grafana/grafana:12.1.0@sha256:6ac590e7cabc2fbe8d7b8fc1ce9c9f0582177b334e0df9c927ebd9670469440f
    ports:
      - "127.0.0.1:3000:3000"          # local only
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is not set, run make init}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on: [prometheus, tempo]
    mem_limit: 512m
    networks: [backend]

networks:
  backend: {}

volumes:
  pgdata:
  reports:
  backups:
  promdata:
  amdata:
  tempodata:
  grafanadata:
