stream_over_http_enabled: true
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Tempo 3 removed the `compactor` block (backend scheduler/worker run in-process with target=all).
# Block retention keeps its default of 336h (14 days), the same value as before. Not verified on a running
# instance: check it on the status endpoint (/status/config) before relying on it.
