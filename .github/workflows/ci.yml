name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Pin Docker API version (Testcontainers client defaults to 1.32, too old for the runner)
        run: echo "api.version=1.44" > ~/.docker-java.properties
      - name: Build and test (Testcontainers uses the Docker of the runner)
        run: mvn -B verify
