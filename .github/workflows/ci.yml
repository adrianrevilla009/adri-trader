name: CI

# Every pull request and every push to main runs the full pipeline. The single job "CI gate" at the end is the only
# check branch protection needs to require: it fails if any job above it failed.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; jobs ask for more only when they need it.
permissions:
  contents: read

env:
  JAVA_VERSION: '21'

jobs:
  # Squash merges use the PR title as the commit message, so the title carries the convention (Conventional Commits).
  pr-title:
    name: PR title (conventional commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            ci
            chore
            refactor
            perf
            build
            revert
          requireScope: false

  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Pin Docker API version (Testcontainers client defaults to 1.32, too old for the runner)
        run: echo "api.version=1.44" > ~/.docker-java.properties
      - name: Build and test (Testcontainers uses the Docker of the runner)
        run: mvn -B verify
      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Line and branch coverage per module (JaCoCo)"
            echo ""
            echo "| Module | Lines | Branches |"
            echo "| --- | ---: | ---: |"
            for f in trading-*/target/site/jacoco/jacoco.csv; do
              [ -f "$f" ] || continue
              awk -F, -v m="$(echo "$f" | cut -d/ -f1)" 'NR>1{mi+=$8;co+=$9;bm+=$6;bc+=$7} END{printf "| %s | %.1f%% | %.1f%% |\n", m, (mi+co)?100*co/(mi+co):0, (bm+bc)?100*bc/(bm+bc):0}' "$f"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/site/jacoco/
          retention-days: 14
      - name: Dependency SBOM (CycloneDX, from the Maven dependency graph)
        run: mvn -B -q org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DoutputFormat=json -DskipTests
      - name: Upload dependency SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-maven-cyclonedx
          path: target/bom.json
          retention-days: 90

  terraform:
    name: Terraform (fmt, validate, tflint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - name: Format
        run: terraform fmt -check -recursive -diff
      - name: Validate (no backend, no cloud credentials)
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - name: Lint
        run: |
          tflint --init --config=.tflint.hcl
          tflint --config=.tflint.hcl

  secrets-scan:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  repo-scan:
    name: Config and secret scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Dockerfile and Terraform misconfigurations plus secrets. Dependencies are scanned in the image job (the real
      # artifact), so pom.xml files are skipped here to avoid resolving them against Maven Central.
      - name: Report to code scanning (SARIF, never fails)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scanners: misconfig,secret
          skip-files: pom.xml,**/pom.xml
          severity: LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'
          format: sarif
          output: trivy-repo.sarif
      - name: Gate (table in the log, fails on any finding)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scanners: misconfig,secret
          skip-files: pom.xml,**/pom.xml
          severity: LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '1'
          format: table
      - name: Upload to code scanning
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          sarif_file: trivy-repo.sarif
          category: trivy-repo

  dependency-review:
    name: Dependency review (new vulnerable or unlicensed dependencies)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  image:
    name: Image (build, vulnerability scan, SBOM, smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: trading
          POSTGRES_USER: trading
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trading -d trading"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: etf-trading-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Vulnerability report to code scanning (SARIF, never fails)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: etf-trading-bot:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          trivyignores: .trivyignore
          format: sarif
          output: trivy-image.sarif
      - name: Vulnerability gate (table in the log, fails on fixable HIGH or CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: etf-trading-bot:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
          format: table
      - name: Upload to code scanning
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: SBOM of the image (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: etf-trading-bot:ci
          format: spdx-json
          artifact-name: sbom-image-spdx.json
          upload-artifact-retention: 90
      - name: Smoke test (starts against a real PostgreSQL, answers on the status page, runs as non-root)
        run: |
          docker run -d --name bot --network host \
            -e DB_URL=jdbc:postgresql://127.0.0.1:5432/trading -e DB_USER=trading -e DB_PASSWORD=ci-only-password \
            etf-trading-bot:ci
          for _ in $(seq 1 40); do
            state=$(docker inspect --format '{{.State.Health.Status}}' bot)
            echo "health: $state"
            [ "$state" = "healthy" ] && break
            [ "$(docker inspect --format '{{.State.Running}}' bot)" = "true" ] || { docker logs bot; exit 1; }
            sleep 5
          done
          [ "$state" = "healthy" ] || { docker logs bot; exit 1; }
          curl -fsS http://127.0.0.1:8098/status
          test "$(docker exec bot id -u)" != "0"
      - name: Container logs
        if: failure()
        run: docker logs bot || true

  sonar:
    name: Code quality (SonarQube Cloud)
    # Enabled when the repository variable SONAR_ENABLED is "true" and the secret SONAR_TOKEN exists.
    # Needs the project to exist in SonarQube Cloud (see docs/ci-cd.md).
    if: ${{ vars.SONAR_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Sonar needs history to attribute new code
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Pin Docker API version
        run: echo "api.version=1.44" > ~/.docker-java.properties
      - name: Build with coverage
        run: mvn -B verify
      - uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # The only job branch protection requires. It runs even when others fail, and fails if any of them failed.
  ci-gate:
    name: CI gate
    if: always()
    needs: [build-test, terraform, secrets-scan, repo-scan, dependency-review, image, sonar, pr-title]
    runs-on: ubuntu-latest
    steps:
      - name: Every required job passed (skipped is fine only for jobs that are conditional)
        run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ toJSON(needs) }}' | grep -qE '"result": "(failure|cancelled)"'; then
            echo "A required job failed or was cancelled"
            exit 1
          fi
