version: 2

# Dependency updates arrive as PRs and go through the same pipeline as any change. Security updates are separate
# and immediate (enable "Dependabot security updates" in the repository settings).
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    # Majors that need a planned migration are not automatic (see docs/ci-cd.md).
    ignore:
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springframework:*"
        update-types: ["version-update:semver-major"]
      # Managed by Spring Boot: only the CVE overrides in pom.xml move off its line, by hand.
      - dependency-name: "io.micrometer:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      spring:
        patterns: ["org.springframework*"]
      jackson:
        patterns: ["com.fasterxml.jackson*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # The runtime is Java 21 (what tests and scans cover). Changing the JDK is a decision, not a bump.
    ignore:
      - dependency-name: "maven"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "build(deps)"

  # Images used by docker-compose.yml (database, Prometheus, Alertmanager, Grafana, Tempo, OpenTelemetry collector).
  # scripts/check-ops.sh pins the same Prometheus and Alertmanager digests: keep them in step when a bump is merged.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The database major is a migration, not a bump.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      # Every Tempo version after 2.8.1 fails the smoke check "Tempo received traces": 3.1.1 (PR #45, which also
      # needs the `compactor` block removed) and 2.10.10 (PR #58, even with an explicit time range). Cause unknown.
      # Debug with a local Docker (`make smoke`), then remove this ignore.
      - dependency-name: "grafana/tempo"
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: weekly
    # Provider majors only once the code has been applied for real.
    ignore:
      - dependency-name: "hashicorp/azurerm"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "build(deps)"
